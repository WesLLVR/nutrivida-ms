server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: usuario-auth
          uri: lb://usuarioMS
          predicates:
            - Path=/api/v1/auth/**
        - id: usuario-ms
          uri: lb://usuarioMS
          predicates:
            - Path=/api/v1/usuarios/**,/api/v1/roles/**,/api/v1/regiones/**
        - id: catalogo-ms
          uri: lb://catalogoMS
          predicates:
            - Path=/api/v1/servicios/**,/api/v1/tipos-servicio/**,/api/v1/nutricionistas/**
        - id: cita-ms
          uri: lb://citaMS
          predicates:
            - Path=/api/v1/citas/**
        - id: ficha-ms
          uri: lb://fichaMS
          predicates:
            - Path=/api/v1/fichas/**
        - id: venta-ms
          uri: lb://ventaMS
          predicates:
            - Path=/api/v1/ventas/**
        - id: contacto-ms
          uri: lb://contactoMS
          predicates:
            - Path=/api/v1/contactos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
